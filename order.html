<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 주문</title>
 <style>
  #container{
    width: 600px;
    margin: 0 auto;
    overflow: hidden;
  }
  ul li{
    list-style-type: none;
    margin-bottom: 10px;
  }
  legend{
    color: blueviolet;
    font-size: large;
    font-weight: bold;
  }
 
 label{
    width: 70px;
    float:left;
    font-weight: bold;
    background-color: #ccc;
  }
  #버튼{
    text-align: center;
    margin-top: 10px;
  }

 </style>
</head>
<body>
  <div id="container">
  <h1>상품 주문서</h1>
  <form action="order.jsp" method="post" name="order">
  <fieldset>
    <legend>개인 정보</legend>
    <ul>
      <li>
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="여백없이 입력">
      </li>
      <li>
        <label for="tel">연락처</label>
        <input type="tel" id="tel" name="tel" placeholder="연락가능한 번호">
      </li>
    </ul>
  </fieldset>
  <fieldset>
    <legend>배송지 정보</legend>
    <ul>
      <li>
        <label for="address">주소</label>
        <input type="text" id="address" name="address">
      </li>
      <li>
        <label for="phone">전화번호</label>
        <input type="number" id="phone" name="phone">
      </li>
      <li>
        <label for="memo">메모</label>
        <textarea cols="50" rows="8"></textarea>
      </li>
    </ul>
  </fieldset>
  <fieldset id="주문">
    <legend>주문 정보</legend>
    <ul>
      <li>
        <label for="a"></label>
        <input type="checkbox" id="a" name="a">경북성주 참외(5kg)
        <input type="number" name="kg" id="kg" value="0" min="0"max="5">box 
        
      </li>
      <li>
        <label for="b"></label>
        <input type="checkbox" id="b" name="b" >경북영천 포도(5kg)
        <input type="number" name="number" id="number" value="0" min="0"max="5">box
      </li>   
        <label for="c"></label>
        <input type="checkbox" id="c" name="c">경북봉화 수박(5kg)
        <input type="number" name="number" id="number" value="0" min="0"max="5">box
      </li>
     </ul>
    </fieldset>
    <div id="버튼">
      <input type="button" value="주문하기">
      <input type="button" value="다시 작성">
    </div>
  </form>
  </div>
</body>
</html>
