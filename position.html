<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position</title>
  <style>
    #box1{
      width: 100px;
      height: 50px;
      background-color: blue;
    }
    #box2{
      width: 300px;
      height: 300px;
      background-color: bisque;
      position: relative;
      top: -25px;
      left: 50px;
    } 
    #box3{
      width: 300px;
      height: 100px;
      background-color: brown;
    }
    .b{
      width: 50px;
      height: 50px;
      background-color: aquamarine;
      position: absolute;
    }
    #b1{
      z-index: 999;
      top:0;
      left:0;
    }
    #b2{
      z-index: 1000;
      top:0;
      right:0;
    }
    #b3{
      bottom:0;
      left:0;
    }
    #b4{
      right:0;
      bottom: 0;
    }
    #b5{
      right: 125px;
      bottom: 125px;
    }
    img{
      width: 100px;
      height: 100px;
    }
    .hidden{
      /* visibility: hidden; */
      opacity: 0.5;
    }
    .hidden:hover{
      opacity: 1;
      border-radius: 50%;
    }
    span{
      /* visibility: hidden; */
      opacity: 0;
    }
    span:hover{
      /* visibility: visible; */
      opacity: 1;
    }
    #box3{
      position: fixed;
      right:30px;
      bottom:30px;
      width:100px;
      height: 100px;
      text-align: center;
      line-height: 100px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div id="box1"><span>박스1</span></div>
  <div id="box2">
    <div class="b" id="b1">b1</div>
    <div class="b" id="b2">b2</div>
    <div class="b" id="b3">b3</div>
    <div class="b" id="b4">b4</div>
    <div class="b" id="b5">b5</div>
  </div>
  <div id="box3"><a href="#"></a></div>
  <img src="img/레드향.jpg" alt="">
  <img src="img/레드향.jpg" alt="" class="hidden">
  <img src="img/레드향.jpg" alt="">
</body>
</html>
