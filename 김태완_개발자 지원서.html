<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국제 개발자 지원서</title>
  <style>
    #container{
      width:600px;
      margin: 0 auto;
      border: 1px solid black;
      padding:60px;
    }

    p{
      font-size: large;
    }

    ul{
      list-style: none;
    }
    
    fieldset{
      border: none;
    }

    legend{
      font-size: large;
      font-weight: bold;
      color:blue;
    }

    label{
      float: left; 
      width: 100px;
    }
    #bb label{
      display: block;/*li 안에서는 인라인레벨*/
      float: none;
      width: 100%
    }  
  </style>
</head>
<body>
  <div id="container">
    <h1>국제 개발자 지원서</h1>
    <p>HTML,CSS,javascript에 대한 기술적 이해와 경험이 있는 분을 찾습니다</p>
    <hr>
    <form action="지원서.jsp" method="post" name="지원서"></form>
    <fieldset id="aa">
      <legend>개인정보</legend>
      <ul>
        <li>
          <label for="name">이름</label>
          <input type="text" name="name" id="name" placeholder="공백없이 입력하세요">
        </li>
        <li>
          <label for="phone">연락처</label>
          <input type="tel" name="phone" id="phone">
        </li>
      </ul>
    </fieldset>
    <fieldset id="bb">
      <legend>지원분야</legend>
      <ul>
        <li>
          <label><input type="radio" name="menu" value="publish" checked>웹 퍼블리싱</label>
          <label><input type="radio" name="menu" value="develop">웹 애플리케이션 개발</label>
          <label><input type="radio" name="menu" value="environment">개발 환경 개선</label>
        </li><!--각각 li로 처리하면 blcok화 안하고 세로로 정렬가능-->
      </ul>
    </fieldset>
    <fieldset id="cc">
      <legend>지원 동기</legend>
      <ul>
        <li>
          <textarea cols="50" rows="6" placeholder="지원동기 간략히 써 주세요"></textarea>
        </li>
        <div id="aaa">
        <li>          
          <input type="button" value="접수하기">
          <input type="button" value="다시쓰기">
        </li>
        </div>
      </ul>
    </fieldset>
  </div>
</body>
</html>
