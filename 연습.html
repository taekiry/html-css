<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김태완</title>
  <link href="css/연습_나.css" rel="stylesheet">
</head>
<body>
  <div id="container">
    <h1>김태완 페이지에 온 것을 환영합니다.</h1>
    <header>
      <nav>
        <ul>
          <li><a>메인메뉴</a></li>
          <li><a>메인메뉴</a></li>
          <li><a>메인메뉴</a></li>
          <li><a>공지사항</a></li>
        </ul>
      </nav>
    </header>
    <aside id="left">
      <h2>좌측 사이드</h2>
    </aside>
    <section>
      <h2>회원가입 영역입니다</h2>
      <form action="login.jsp" method="post" name="login">
        <fieldset>
          <legend>개인정보 등록</legend>
          <ul>
            <li>
              <label for="id1">계정아이디</label>
              <input type="text" id="id1" name="id" autofocus>
            </li>
            <li>
              <label for="pw1">비밀번호 확인</label>
              <input type="password" id="pw1" name="pw1">
            </li>
            <li>
              <label for="pw2">비밀번호</label>
              <input type="password" id="pw2" name="pw2">
            </li>
            <li>
              <label for="name">이름</label>
              <input type="text" id="name" name="name" placeholder="5자 미만 공백없이">
            </li>
            <li>
              <label for="phone">전화번호</label>
              <input type="tel" id="phone" name="phone">
            </li>
          </ul>
        </fieldset>
        <fieldset>
            <button type="submit">회원 가입</button> 
            <button type="reset">정보 수정</button>
      </fieldset>
      </form>
    </section>
    <aside id="right">
      <h2>우측 사이드</h2>
    </aside>
    <footer>
      <h2>푸터영역 입니다</h2>
    </footer>
  </div> 
</body>
</html>
